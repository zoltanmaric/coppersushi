name: Copper Sushi tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Select Ghost checks
        id: ghost
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          elif git diff --quiet HEAD^1 HEAD -- 121gigawatts/ pyproject.toml pixi.lock .github/workflows/; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: prefix-dev/setup-pixi@v0.9.4
        with:
          pixi-version: v0.77.1
          cache: true
          locked: true
      - run: pixi run --locked frontend-build
      - run: pixi run --locked test-core
      - name: Install Ghost dependencies
        if: steps.ghost.outputs.changed == 'true'
        run: |
          pixi run --locked theme-install
          pixi run --locked hosting-setup
      - name: Check Ghost theme and hosting
        if: steps.ghost.outputs.changed == 'true'
        run: |
          pixi run --locked theme-test
          pixi run --locked hosting-test

  container:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the locked container environment
        uses: docker/build-push-action@v7
        with:
          context: .
          target: environment
          platforms: linux/amd64
          load: true
          tags: coppersushi-environment
          provenance: false
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,scope=runtime,mode=max
      - name: Check container activation and native libraries
        run: >-
          docker run --rm -v "$PWD/tests/fixtures:/fixtures:ro"
          --entrypoint /bin/bash coppersushi-environment /opt/entrypoint.sh
          python infra/lambda/check-runtime.py /fixtures
