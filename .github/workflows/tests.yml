name: Copper Sushi tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.9.4
        with:
          pixi-version: v0.77.1
          cache: true
          locked: true
      - run: pixi run --locked setup
      - run: pixi run --locked test
      - name: Build the locked container environment
        run: docker build --target environment -t coppersushi-environment .
      - name: Check container activation and native libraries
        run: >-
          docker run --rm --entrypoint /bin/bash coppersushi-environment /opt/entrypoint.sh
          python -c 'import dash, geopandas, netCDF4, numpy, pandas, pyarrow, pyproj, pypsa, shapely'
