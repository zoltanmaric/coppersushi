name: Copper Sushi tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tasks: ${{ steps.select.outputs.tasks }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Select checks
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            ghost=true
          elif git diff --quiet HEAD^1 HEAD -- 121gigawatts/ pyproject.toml pixi.lock .github/workflows/; then
            ghost=false
          else
            ghost=true
          fi
          if [[ "$ghost" == true ]]; then
            echo 'tasks=["test-python","test-quality","theme-test","hosting-test"]' >> "$GITHUB_OUTPUT"
          else
            echo 'tasks=["test-python","test-quality"]' >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        task: ${{ fromJSON(needs.checks.outputs.tasks) }}
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.9.4
        with:
          pixi-version: v0.77.1
          cache: true
          cache-write: ${{ matrix.task == 'test-python' }}
          locked: true
      - name: Build frontend assets for application tests
        if: matrix.task == 'test-python'
        run: pixi run --locked frontend-build
      - name: Install frontend dependencies
        if: matrix.task == 'test-quality'
        run: pixi run --locked frontend-install
      - name: Install Ghost dependencies
        if: matrix.task == 'theme-test'
        run: pixi run --locked theme-install
      - name: Install hosting dependencies
        if: matrix.task == 'hosting-test'
        run: pixi run --locked hosting-setup
      - name: Run check
        env:
          CHECK_TASK: ${{ matrix.task }}
        run: pixi run --locked "$CHECK_TASK"

  container:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Check the locked container environment
        uses: docker/build-push-action@v7
        with:
          context: .
          target: publisher-check
          platforms: linux/amd64
          outputs: type=cacheonly
          provenance: false
