name: Copper Sushi tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tasks: ${{ steps.select.outputs.tasks }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Select checks
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          needs_check() {
            [[ "$EVENT_NAME" == workflow_dispatch ]] ||
              ! git diff --quiet HEAD^1 HEAD -- pyproject.toml pixi.lock .github/workflows/ "$@"
          }

          tasks=(test-python test-quality)
          needs_check theme/ 121gigawatts/theme/ && tasks+=(theme-test)
          needs_check 121gigawatts/hosting/ && tasks+=(hosting-test)
          matrix=$(jq -cn --args '$ARGS.positional' "${tasks[@]}")
          echo "tasks=$matrix" >> "$GITHUB_OUTPUT"

  test:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        task: ${{ fromJSON(needs.checks.outputs.tasks) }}
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.9.4
        with:
          pixi-version: v0.77.1
          cache: true
          cache-write: ${{ matrix.task == 'test-python' }}
          locked: true
      - name: Build frontend assets for application tests
        if: matrix.task == 'test-python'
        run: pixi run --locked frontend-build
      - name: Install frontend dependencies
        if: matrix.task == 'test-quality'
        run: pixi run --locked frontend-install
      - name: Install Ghost dependencies
        if: matrix.task == 'theme-test'
        run: pixi run --locked theme-install
      - name: Install Nginx for hosting integration checks
        if: matrix.task == 'hosting-test'
        run: |
          sudo apt-get update
          sudo apt-get install -y nginx
      - name: Install hosting dependencies
        if: matrix.task == 'hosting-test'
        run: pixi run --locked hosting-setup
      - name: Run check
        env:
          CHECK_TASK: ${{ matrix.task }}
        run: pixi run --locked "$CHECK_TASK"
      - name: Check Ghost recovers after database maintenance
        if: matrix.task == 'hosting-test'
        run: sudo python3 121gigawatts/hosting/tests/check_systemd_recovery.py

  container:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Check the locked container environment
        uses: docker/build-push-action@v7
        with:
          context: .
          file: coppersushi/infra/lambda/Dockerfile
          target: publisher-check
          platforms: linux/amd64
          outputs: type=cacheonly
          provenance: false
