name: coppersushi
channels:
  - conda-forge
dependencies:
  # Pinned exactly (2026-08) for long-term reproducibility
  - python =3.14.6
  - pytest =9.1.1
  - dash =4.4.1
  - dash-bootstrap-components =2.0.4
  - pypsa =1.2.4
  - pandas =3.0.5
  - plotly =6.9.0
  - numpy =2.5.2
  - pandera =0.32.1
  - openpyxl =3.1.5  # pandas' xlsx engine; JAO publishes the Static Grid Model as a workbook
  - gunicorn =26.0.0  # For deploying to Heroku
  - pyyaml =6.0.3
  - git-lfs =3.8.0  # Networks are LFS-tracked; run `git lfs install` once after creating the env
