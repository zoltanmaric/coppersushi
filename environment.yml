name: coppersushi
channels:
  - conda-forge
dependencies:
  # Pinned exactly (2026-08) for long-term reproducibility
  - python =3.14.6
  - pytest =9.1.1
  - dash =4.4.1
  - dash-bootstrap-components =2.0.4
  - pypsa =1.2.4
  - pandas =3.0.5
  - plotly =6.9.0
  - numpy =2.5.2
  - gunicorn =26.0.0  # For deploying to Heroku
  - snakeviz =2.2.2  # For visualising cProfile results
  - git-lfs =3.8.0  # Networks are LFS-tracked; run `git lfs install` once after creating the env
