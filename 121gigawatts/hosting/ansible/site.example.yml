---
# Copy outside the repository. Paths below refer to private files on your Mac.
domain: blog.example.org
site_url: http://localhost:2371
# A complete config.production.json with MySQL credentials and working SMTP.
# Its url MUST equal site_url; server MUST bind 127.0.0.1:2368.
ghost_config_file: /absolute/private/path/config.production.json
origin_certificate_file: /absolute/private/path/origin.crt
origin_key_file: /absolute/private/path/origin.key
