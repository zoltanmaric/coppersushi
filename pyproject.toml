[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "coppersushi"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "dash==4.4.1",
    "dash-bootstrap-components==2.0.4",
    "pandas==3.0.5",
    "plotly==6.9.0",
    "numpy==2.5.2",
    "pandera[polars]==0.35.0",
    "pydantic==2.14.1",
    "polars==2.1.0",
    "openpyxl==3.1.5",
    "gunicorn==26.0.0",
    "boto3==1.43.118",
    "pyyaml==6.0.3",
    "geopandas>=1,<2",
    "pyproj>=3.7,<4",
    "shapely>=2,<3",
    "pyarrow==25.0.1",
]

[project.optional-dependencies]
build = ["pypsa==1.2.4"]
dev = [
    "pytest==9.1.1",
    "pytest-xdist==3.8.0",
    "mypy==2.4.0",
    "ansible-core==2.20.0",
    "pandas-stubs==3.0.5.260914",
    "types-shapely==2.1.0.20261030",
    "types-PyYAML==6.0.12.20261103",
    "boto3-stubs[s3,secretsmanager]==1.43.118",
    "pyarrow-stubs==20.0.0.20260819",
    "plotly-stubs==0.1.4",
]

[tool.setuptools.packages.find]
include = ["coppersushi*", "forecasts*"]
exclude = ["forecasts.tests*", "forecasts.evidence*"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = [{ name = "macos-15-arm64", platform = "osx-arm64", macos = "15.0" }, "linux-64"]
requires-pixi = ">=0.77.1,<0.78"

[tool.pixi.dependencies]
python = "3.14.10.*"

[tool.pixi.feature.dev.dependencies]
git-lfs = "3.8.0.*"
terraform = "1.5.7.*"
nodejs = "22.*"
yarn = "1.22.22.*"
make = "4.4.1.*"

[tool.pixi.pypi-dependencies]
coppersushi = { path = ".", editable = true }

[tool.pixi.feature.publisher.target.linux-64.pypi-dependencies]
awslambdaric = "==3.1.1"

[tool.pixi.environments]
default = { features = ["build", "dev"], solve-group = "default" }
publisher = { features = ["publisher"], platforms = ["linux-64"], solve-group = "default" }
runtime = { features = [], solve-group = "default" }
build = { features = ["build"], solve-group = "default" }

[tool.pixi.tasks]
setup = { cmd = "python -c \"import sys; print('Python interpreter:', sys.executable)\"", depends-on = ["theme-install", "hosting-setup", "frontend-build"] }
setup-app = { depends-on = ["setup", "setup-data"] }
setup-data = "git lfs pull && python -m coppersushi.data_sources.runtime_data prepare"
check-data = "python -m coppersushi.data_sources.runtime_data check"
dev = { cmd = "python app.py", depends-on = ["check-data", "frontend-build"] }
build-zone-shapes = "python -m coppersushi.grid_catalog.data_sources.zone_shapes"
test-app = "python -m pytest -q -n 4 --dist loadfile --durations=20"
test-forecast = "python -m unittest discover -s forecasts/tests -v"
typecheck = "python -m mypy --config-file mypy.ini"
test-python = { depends-on = ["test-app", "test-forecast"] }
test-quality = { depends-on = ["typecheck", "frontend-test"] }
test-core = { depends-on = ["test-python", "test-quality"] }
test = { depends-on = ["test-core", "theme-test", "hosting-test"] }
solve = "python -m coppersushi.opf.data_sources.pypsa_eur solve"
theme-install = { cmd = "yarn install --frozen-lockfile --ignore-optional", cwd = "121gigawatts" }
theme-dev = { cmd = "yarn dev", cwd = "121gigawatts" }
theme-test = { cmd = "yarn test:ci", cwd = "121gigawatts" }
theme-zip = { cmd = "yarn zip", cwd = "121gigawatts" }
hosting-setup = "make -C 121gigawatts/hosting setup"
hosting-test = "make -C 121gigawatts/hosting test"
hosting-check = "make -C 121gigawatts/hosting check"
hosting-configure = "make -C 121gigawatts/hosting configure"
hosting-restore = "make -C 121gigawatts/hosting restore"

frontend-install = { cmd = "npm ci", cwd = "frontend" }
frontend-build = { cmd = "npm run build", cwd = "frontend", depends-on = ["frontend-install"] }
frontend-test = "python -m scripts.cnec_contracts --check && npm run --prefix frontend types -- --check && npm run --prefix frontend typecheck && npm test --prefix frontend"
frontend-contracts = "python -m scripts.cnec_contracts && npm run --prefix frontend types"
