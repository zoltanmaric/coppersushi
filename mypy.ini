[mypy]
files = app.py, cnec_server.py, frontend/publish.py, coppersushi, forecasts
plugins = pydantic.mypy, pandera.mypy
disallow_untyped_defs = True
check_untyped_defs = True
warn_unused_ignores = True

[pydantic-mypy]
init_typed = True
warn_required_dynamic_aliases = True

# Dash Bootstrap Components publishes neither inline typing nor a stub package.
[mypy-dash_bootstrap_components.*]
ignore_missing_imports = True
